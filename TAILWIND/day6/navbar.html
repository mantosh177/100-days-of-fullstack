<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Variations</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: grey;
            color: white;
        }

        .nav_container {
            margin-bottom: 40px;

        }

        h2 {
            margin-bottom: 10px;
        }

        .nav1 {
            border: 1px;
            background-color: #9dbedf;
            padding: 100px;
        }

        .nav1 ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        .nav1 li{
            display: inline;

        }
        .nav1 a{
            text-decoration: none;
            color:rgb(6, 83, 150);
            background-color:  rgb(164, 134, 164);
            padding: 5px 15px;
            position: relative;
        }
        .nav1 a::after{
            content: "abc";
            position: absolute;
            height: 12px;
            width: 100%;
            bottom: 0px;
            left: 0px;
            background-color: #4c299c;
            transform: scaleX(0);
            transition: transform 0.3s 
            ease-in-out;
        }
            .nav1 a:hover::after{
                transform: scaleX(1);
               
            }
        
        .nav1 .login-btn{
            background-color: rgb(51, 51, 230);
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .nav2{
            background-color: #343a40;
            width: 200px;
            padding: 20px;
            text-align: left;
        }
        .nav2 ul{
            list-style-type: none;
            margin: 0px;
            padding: 0px;

        }
        .nav2 li{
            margin-bottom: 12px;

        }
        .nav2 a{
            text-decoration: none;
            color: #4a08e4;
            display: block;
            padding: 10px;
            width: 100%;
        }
        .nav2 a:hover{
            background-color: #100e0e;
        }
        .nav2 .login-btn{
            background-color: #07b343;
            color: blanchedalmond;
            border: none;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            margin-left: 3px;
        }
        .nav2 .login-btn:hover{
            background-color: blue;
            color: #c40b2d;
            border: 1px solid white;
        }
        .nav3{
            background-color: rgb(105, 217, 225);
            padding: 10px;
        }
        .nav3 ul{
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav3 a{
            text-decoration: none;
            color: rgb(15, 15, 208);
            padding: 10px;
            display: block;
        }
        .nav3 .dropdown-content{
            display: none;
           
        }
        .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position: absolute;
            background-color: white;
            color: blue;
            min-width: 150px;
        }
    </style>

</head>

<body>
    <div class="nav-container">
        <h2>Variation 1 : Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
<div class="nav-container">
    <h2>Variation 2: Vertical with hover effect</h2>
    <nav class="nav2">
        <ul>
            <li><a href="#" >Home</a></li>
            <li><a href="#" >About</a></li>
            <li><a href="#" >Products</a></li>
            
        </ul>
        <button class="login-btn">Login</button>
    </nav>
</div>
<div class="nav-container">
    <nav class="nav3">
        <ul>
            <li><a href="#">Home</a></li>
            <li class="dropdown">
                <a href="#">About</a>
                <div class="dropdown-content">
                    <a href="#" >Our story</a>
                    <a href="#" >Team</a>
                    <a href="#" >Contact</a>
                </div>
            </li>
            <li><a href="#" >Products</a></li>
            <li><button
            class="login-btn">Login</button>
            </button></li>
        </ul>
    </nav>
</div>

</body>

</html>
