<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Variations</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: grey;
            color: white;
        }

        .nav_container {
            margin-bottom: 40px;

        }

        h2 {
            margin-bottom: 10px;
        }

        .nav1 {
            border: 1px;
            background-color: #9dbedf;
            padding: 100px;
        }

        .nav1 ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }
        .nav1 li{
            display: inline;

        }
        .nav1 a{
            text-decoration: none;
            color:rgb(6, 83, 150);
            background-color:  rgb(164, 134, 164);
            padding: 5px 15px;
            position: relative;
        }
        .nav1 a::after{
            content: "abc";
            position: absolute;
            height: 12px;
            width: 100%;
            bottom: 0px;
            left: 0px;
            background-color: #4c299c;
            transform: scaleX(0);
            transition: transform 0.3s 
            ease-in-out;
        }
            .nav1 a:hover::after{
                transform: scaleX(1);
               
            }
        
        .nav1 .login-btn{
            background-color: rgb(51, 51, 230);
            color: #fff;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

</head>

<body>
    <div class="nav-container">
        <h2>Variation 1 : Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>



</body>

</html>
